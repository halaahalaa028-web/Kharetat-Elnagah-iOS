workflows:
  ios-workflow:
    name: Kharetat Elnagah iOS

    integrations:
      app_store_connect: itaaleem

    environment:
      xcode: 26.5
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elshroq.sheetvault

    scripts:
      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/src"
          pod install --repo-update

      - name: Apply signing profiles
        script: |
          cd "$CM_BUILD_DIR/src"
          xcode-project use-profiles

      - name: Build IPA for distribution
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/src/خريطة النجاة.xcworkspace" \
            --scheme "KharetatElnagah"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
