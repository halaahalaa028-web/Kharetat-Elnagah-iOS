workflows:
  ios-workflow:
    name: Kharetat Elnagah iOS

    integrations:
      app_store_connect: itaaleem

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elshroq.sheetvault

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd src
          pod install --repo-update

      - name: Set up code signing
        script: |
          cd src
          xcode-project use-profiles

      - name: Build iOS app
        script: |
          cd src
          xcodebuild \
            -project "*.xcodeproj" \
            -scheme "KharetatElnagah" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ../build/KharetatElnagah.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=26P3HVTQKC \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Kharetat Elnagah App Store" \
            archive

    artifacts:
      - build/KharetatElnagah.xcarchive/**

    publishing:
      app_store_connect:
        auth: integration
