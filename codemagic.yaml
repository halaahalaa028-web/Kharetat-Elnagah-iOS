
workflows:
  ios-workflow:
    name: Kharetat Elnagah iOS

    integrations:
      app_store_connect: itaaleem

    environment:
      xcode: 26.5
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.elshroq.sheetvault

    scripts:
      - name: Install CocoaPods
        script: |
          cd src
          pod install --repo-update

      - name: Apply signing profiles
        script: |
          cd src
          xcode-project use-profiles

      - name: Build and archive
        script: |
          cd src
          xcodebuild \
            -project "خريطة النجاة.xcodeproj" \
            -scheme "KharetatElnagah" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "../build/KharetatElnagah.xcarchive" \
            archive

    artifacts:
      - build/KharetatElnagah.xcarchive/**

    publishing:
      app_store_connect:
        auth: integration
